name: Test and publish HA images
on:
  push:
    branches: [main]
    paths: [campsite_journal/**, tests/**, .github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: campsite-journal-publish
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r campsite_journal/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check campsite_journal/static/scroll-top.js
      - run: node --check campsite_journal/static/kakao-maps.js
      - run: node tests/test_scroll_top.cjs
      - run: node tests/test_kakao_maps.cjs
      - run: node tests/test_web_updates.cjs
      - run: node tests/test_detail.cjs
      - run: node --check campsite_journal/static/app.js
      - run: node --check campsite_journal/static/connect.js
      - run: node --check campsite_journal/static/stay-picker.js
      - run: node --check campsite_journal/static/free-address.js
      - run: node --check campsite_journal/static/campsite-finder.js
      - run: node --check campsite_journal/static/live-sync.js
      - run: node tests/test_stay_picker.cjs
      - run: node tests/test_list.cjs
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          echo "value=$(sed -n 's/^version: "\(.*\)"/\1/p' campsite_journal/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./campsite_journal
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/kojungho/campsite-journal:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_ARCH=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/kojungho/campsite-journal-addon
            org.opencontainers.image.title=Campsite Journal
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          echo "value=$(sed -n 's/^version: "\(.*\)"/\1/p' campsite_journal/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/kojungho/campsite-journal:$VERSION" "ghcr.io/kojungho/campsite-journal:$VERSION-amd64" "ghcr.io/kojungho/campsite-journal:$VERSION-aarch64"
          docker buildx imagetools inspect "ghcr.io/kojungho/campsite-journal:$VERSION"
